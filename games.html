<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberStart | Games</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            min-height: 100vh;

            background:
                radial-gradient(circle at 20% 20%, rgba(0, 170, 255, 0.15), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 170, 0.10), transparent 30%),
                linear-gradient(135deg, #050812, #07111f, #03060d);

            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background-image:
                linear-gradient(rgba(0, 180, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 180, 255, 0.04) 1px, transparent 1px);

            background-size: 45px 45px;

            animation: gridMove 18s linear infinite;

            z-index: -1;
        }

        @keyframes gridMove {

            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(45px);
            }

        }

        /* NAV */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 16px 6%;

            background: rgba(3, 8, 18, 0.85);

            backdrop-filter: blur(18px);

            border-bottom: 1px solid rgba(0, 200, 255, 0.15);
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
            white-space: nowrap;
        }

        .logo span {
            color: #00d9ff;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: #c9d7e8;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #00d9ff;
        }

        .nav-links .active {
            color: #00d9ff;
        }

        .donate {
            padding: 9px 15px;

            border-radius: 20px;

            border: 1px solid rgba(0, 255, 170, 0.5);

            color: #7dffc9 !important;

            background: rgba(0, 255, 170, 0.08);
        }

        /* HERO */

        .hero {
            text-align: center;
            padding: 75px 20px 45px;
        }

        .hero-icon {
            font-size: 58px;
            margin-bottom: 15px;

            filter:
                drop-shadow(0 0 18px rgba(0, 200, 255, 0.5));
        }

        .hero h1 {
            font-size: clamp(40px, 8vw, 70px);

            margin-bottom: 12px;

            background:
                linear-gradient(90deg, #ffffff, #00d9ff);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: #9eb2c8;

            max-width: 680px;

            margin: auto;

            line-height: 1.7;

            font-size: 17px;
        }

        .tagline {
            margin-top: 15px;

            color: #00e5ff;

            font-size: 13px;

            letter-spacing: 4px;

            font-weight: bold;
        }

        /* GAME GRID */

        .games-container {
            width: min(1100px, 92%);

            margin: 20px auto 80px;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 24px;
        }

        /* GAME CARD */

        .game-card {
            position: relative;

            padding: 28px;

            border-radius: 22px;

            background:
                rgba(9, 20, 35, 0.72);

            border:
                1px solid rgba(0, 190, 255, 0.18);

            backdrop-filter: blur(16px);

            box-shadow:
                0 0 35px rgba(0, 170, 255, 0.07);

            transition: 0.3s;
        }

        .game-card:hover {
            transform: translateY(-5px);

            border-color:
                rgba(0, 210, 255, 0.45);

            box-shadow:
                0 0 35px rgba(0, 190, 255, 0.15);
        }

        .game-icon {
            font-size: 42px;

            margin-bottom: 15px;
        }

        .game-card h2 {
            font-size: 23px;

            margin-bottom: 10px;
        }

        .game-card p {
            color: #9eb2c8;

            line-height: 1.6;

            margin-bottom: 20px;
        }

        .difficulty {
            display: inline-block;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 11px;

            color: #7de8ff;

            background:
                rgba(0, 200, 255, 0.08);

            border:
                1px solid rgba(0, 200, 255, 0.2);

            margin-bottom: 20px;
        }

        /* GAME AREA */

        .game-area {
            display: none;

            margin-top: 20px;

            padding: 20px;

            border-radius: 15px;

            background:
                rgba(0, 0, 0, 0.22);

            border:
                1px solid rgba(255, 255, 255, 0.08);
        }

        .game-area.show {
            display: block;
        }

        .scenario {
            color: #dcecff;

            line-height: 1.6;

            margin-bottom: 18px;
        }

        /* OPTIONS */

        .option {
            width: 100%;

            padding: 13px 15px;

            margin-bottom: 10px;

            text-align: left;

            color: #e7f2ff;

            background:
                rgba(255, 255, 255, 0.035);

            border:

            border
