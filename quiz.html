<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CyberStart | Quiz</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;

    background-color: #070b16;

    background-image:
        radial-gradient(
            circle at 50% -10%,
            rgba(56, 189, 248, 0.18),
            transparent 45%
        ),
        linear-gradient(
            rgba(56, 189, 248, 0.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(56, 189, 248, 0.035) 1px,
            transparent 1px
        );

    background-size:
        100% 100%,
        45px 45px,
        45px 45px;

    background-attachment: fixed;
}


/* =========================
   NAVIGATION
========================= */

nav {
    background: rgba(11, 16, 32, 0.94);

    border-bottom:
        1px solid
        rgba(96, 165, 250, 0.15);

    padding: 18px 25px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    position: sticky;
    top: 0;

    z-index: 1000;

    backdrop-filter: blur(12px);
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #38bdf8;
    white-space: nowrap;
}

nav div:last-child {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 18px;
}

nav a {
    color: white;
    text-decoration: none;

    font-weight: bold;
    font-size: 16px;

    transition: 0.2s;
}

nav a:hover {
    color: #38bdf8;
}


/* =========================
   HERO
========================= */

.hero {
    text-align: center;

    padding: 75px 20px 45px;

    position: relative;

    overflow: hidden;
}

.hero::before {
    content: "";

    position: absolute;

    width: 400px;
    height: 400px;

    top: -250px;
    left: -100px;

    background:
        radial-gradient(
            circle,
            rgba(56, 189, 248, 0.40),
            transparent 65%
        );

    filter: blur(30px);

    animation:
        cyberGlow 5s ease-in-out infinite alternate;

    pointer-events: none;
}

.hero::after {
    content: "";

    position: absolute;

    width: 350px;
    height: 350px;

    top: -200px;
    right: -100px;

    background:
        radial-gradient(
            circle,
            rgba(37, 99, 235, 0.35),
            transparent 65%
        );

    filter: blur(30px);

    animation:
        cyberGlow2 6s ease-in-out infinite alternate;

    pointer-events: none;
}

@keyframes cyberGlow {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(500px);
    }

}

@keyframes cyberGlow2 {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-500px);
    }

}

.hero h1,
.hero h2,
.hero p {
    position: relative;
    z-index: 2;
}

.hero h1 {
    color: #38bdf8;

    font-size: 25px;

    margin: 0 0 20px;
}

.hero h2 {
    color: #38bdf8;

    font-size: 42px;

    margin: 0 0 15px;
}

.hero p {
    max-width: 750px;

    margin: auto;

    color: #a9bbcf;

    font-size: 18px;

    line-height: 1.7;
}


/* =========================
   QUIZ CONTAINER
========================= */

.quiz-container {

    max-width: 850px;

    margin: auto;

    padding: 20px 20px 60px;
}


/* =========================
   PROGRESS
========================= */

.progress-box {

    margin-bottom: 20px;

    text-align: center;

    color: #9fb3c8;
}

.progress-bar {

    width: 100%;

    height: 9px;

    background: #101c2d;

    border-radius: 20px;

    overflow: hidden;

    margin-top: 10px;
}

.progress-fill {

    height: 100%;

    width: 0%;

    background: #38bdf8;

    transition: width 0.3s;
}


/* =========================
   QUESTION CARD
========================= */

.quiz-card {

    background:
        linear-gradient(
            145deg,
            rgba(17, 26, 51, 0.97),
            rgba(10, 17, 35, 0.97)
        );

    border:
        1px solid
        rgba(96, 165, 250, 0.20);

    border-radius: 18px;

    padding: 30px;

    box-shadow:
        0 15px 35px
        rgba(0, 0, 0, 0.20);
}

.question-number {

    color: #7dd3fc;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 1px;

    text-transform: uppercase;
}

.quiz-card h3 {

    color: white;

    font-size: 24px;

    line-height: 1.4;

    margin:
        12px 0 25px;
}


/* =========================
   ANSWERS
========================= */

.answers {

    display: grid;

    gap: 12px;
}

.answer {

    width: 100%;

    padding: 15px;

    border-radius: 10px;

    border:
        1px solid
        #315273;

    background:
        #0b1728;

    color: #d7e5f2;

    text-align: left;

    font-size: 16px;

    cursor: pointer;

    transition: 0.2s;
}

.answer:hover {

    border-color:
        #38bdf8;

    background:
        #10243a;

    transform:
        translateX(3px);
}

.answer.selected {

    border-color:
        #38bdf8;

    background:
        #12304a;

    color: white;
}


/* =========================
   NAV BUTTONS
========================= */

.quiz-actions {

    display: flex;

    gap: 12px;

    margin-top: 25px;
}

.quiz-button {

    flex: 1;

    padding: 14px;

    border-radius: 10px;

    border:
        1px solid
        #315273;

    background:
        #10243a;

    color:
        #7dd3fc;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

.quiz-button:hover {

    background:
        #173652;

    border-color:
        #38bdf8;
}


/* =========================
   RESULT
========================= */

.result {

    display: none;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            rgba(17, 26, 51, 0.97),
            rgba(10, 17, 35, 0.97)
        );

    border:
        1px solid
        rgba(56, 189, 248, 0.35);

    border-radius: 18px;

    padding: 35px;

    margin-top: 25px;
}

.result h3 {

    color: #38bdf8;

    font-size: 30px;
}

.score {

    font-size: 48px;

    font-weight: bold;

    color: #7dd3fc;

    margin: 15px;
}

.result p {

    color: #c2d0df;

    line-height: 1.7;
}


/* =========================
   FOOTER
========================= */

footer {

    margin-top: 30px;

    padding: 35px 20px;

    text-align: center;

    background:
        rgba(11, 16, 32, 0.95);

    border-top:
        1px solid
        rgba(96, 165, 250, 0.15);

    color:
        #8195aa;
}

footer p:first-child {

    color:
        #38bdf8;

    font-size: 20px;

    font-weight: bold;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    nav {

        flex-direction: column;

        gap: 16px;

        padding:
            18px 12px;
    }

    nav div:last-child {

        gap:
            12px 16px;
    }

    nav a {

        font-size: 14px;
    }

    .hero {

        padding:
            60px 20px 35px;
    }

    .hero h2 {

        font-size: 32px;
    }

    .hero p {

        font-size: 17px;
    }

    .quiz-card {

        padding: 22px;
    }

    .quiz-card h3 {

        font-size: 21px;
    }

    .quiz-actions {

        flex-direction: column;
    }

}

</style>

</head>


<body>


<!-- =========================
     NAVIGATION
========================= -->

<nav>

    <div class="logo">
        🛡️ CyberStart
    </div>

    <div>

        <a href="index.html">
            Home
        </a>

        <a href="lessons.html">
            Lessons
        </a>

        <a href="labs.html">
            Labs
        </a>

        <a href="quiz.html">
            Quiz
        </a>

        <a href="games.html">
            Games
        </a>

        <a href="glossary.html">
            Glossary
        </a>

    </div>

</nav>


<!-- =========================
     HERO
========================= -->

<section class="hero">

    <h1>
        🛡️ CyberStart
    </h1>

    <h2>
        Cybersecurity Quiz
    </h2>

    <p>
        Test your knowledge of cybersecurity
        concepts, threats, and defenses.
    </p>

</section>


<!-- =========================
     QUIZ
========================= -->

<section class="quiz-container">


    <div class="progress-box">

        <span id="progressText">
            Question 1 of 20
        </span>

        <div class="progress-bar">

            <div
                class="progress-fill"
                id="progressFill">
            </div>

        </div>

    </div>


    <div
        class="quiz-card"
        id="quizCard">

        <div
            class="question-number"
            id="questionNumber">

            Question 1

        </div>

        <h3
            id="questionText">
        </h3>


        <div
            class="answers"
            id="answers">
        </div>


        <div class="quiz-actions">

            <button
                class="quiz-button"
                id="nextButton"
                onclick="nextQuestion()">

                Next Question →

            </button>

        </div>

    </div>


    <!-- RESULT -->

    <div
        class="result"
        id="result">

        <h3>
            🎉 Quiz Complete!
        </h3>

        <div
            class="score"
            id="score">
        </div>

        <p
            id="resultMessage">
        </p>

        <button
            class="quiz-button"
            onclick="restartQuiz()">

            🔄 Restart Quiz

        </button>

    </div>


</section>


<!-- =========================
     FOOTER
========================= -->

<footer>

    <p>
        🛡️ CyberStart
    </p>

    <p>
        Learn. Practice. Stay Secure.
    </p>

    <p>
        © 2026 CyberStart
    </p>

</footer>


<!-- =========================
     JAVASCRIPT
========================= -->

<script>


/* =========================================
   QUIZ QUESTIONS
========================================= */

const questions = [

    {
        question:
            "What does MFA stand for?",

        answers: [
            "Multi-Factor Authentication",
            "Main Firewall Access",
            "Multiple File Authorization",
            "Managed Firewall Application"
        ],

        correct: 0
    },


    {
        question:
            "What is phishing?",

        answers: [
            "A type of computer hardware",
            "A technique used to trick people into revealing information",
            "A method of encrypting files",
            "A type of firewall"
        ],

        correct: 1
    },


    {
        question:
            "What does a firewall primarily do?",

        answers: [
            "Creates passwords",
            "Deletes every file on a computer",
            "Controls network traffic according to rules",
            "Writes computer programs"
        ],

        correct: 2
    },


    {
        question:
            "What is malware?",

        answers: [
            "Malicious software",
            "A network cable",
            "A secure password",
            "A backup system"
        ],

        correct: 0
    },


    {
        question:
            "What does encryption do?",

        answers: [
            "Deletes information",
            "Turns protected data into readable data for everyone",
            "Transforms information so it can be protected from unauthorized reading",
            "Makes a computer physically faster"
        ],

        correct: 2
    },


    {
        question:
            "What is a vulnerability?",

        answers: [
            "A security weakness",
            "A type of monitor",
            "A backup copy",
            "A programming language"
        ],

        correct: 0
    },


    {
        question:
            "What is hashing commonly used for?",

        answers: [
            "Increasing screen brightness",
            "Checking data integrity",
            "Connecting a keyboard",
            "Creating Wi-Fi signals"
        ],

        correct: 1
    },


    {
        question:
            "What does DNS help with?",

        answers: [
            "Translating domain names into IP addresses",
            "Scanning physical computers",
            "Creating passwords",
            "Removing malware automatically"
        ],

        correct: 0
    },


    {
        question:
            "What is social engineering?",

        answers: [
            "Building computer networks",
            "Manipulating people to influence their actions or reveal information",
            "Installing a graphics card",
            "Encrypting a hard drive"
        ],

        correct: 1
    },


    {
        question:
            "What is ransomware?",

        answers: [
            "A type of keyboard",
            "Malware that can deny access to data or systems and demand payment",
            "A network protocol",
            "A password manager"
        ],

        correct: 1
    },


    {
        question:
            "What does the principle of least privilege mean?",

        answers: [
            "Everyone gets administrator access",
            "Users receive only the access they need",
            "Passwords should be short",
            "Networks should have no security rules"
        ],

        correct: 1
    },


    {
        question:
            "What is a zero-day vulnerability?",

        answers: [
            "A vulnerability that is unknown or not yet patched",
            "A computer with no storage",
            "A password that expires daily",
            "A network with zero users"
        ],

        correct: 0
    },


    {
        question:
            "What is a brute-force attack?",

        answers: [
            "Repeatedly trying possible authentication values",
            "Physically damaging a computer",
            "Updating antivirus software",
            "Creating a backup"
        ],

        correct: 0
    },


    {
        question:
            "What is an IP address?",

        answers: [
            "A type of malware",
            "A numerical address associated with a device or network interface",
            "A password",
            "An encryption algorithm"
        ],

        correct: 1
    },


    {
        question:
            "What is a VPN?",

        answers: [
            "A Virtual Private Network",
            "A Virus Protection Number",
            "A Virtual Password Node",
            "A Verified Port Network"
        ],

        correct: 0
    },


    {
        question:
            "What is incident response?",

        answers: [
            "The process of handling cybersecurity incidents",
            "A way to create websites",
            "A method for increasing internet speed",
            "A type of computer monitor"
        ],

        correct: 0
    },


    {
        question:
            "What is a Trojan?",

        answers: [
            "Malware that disguises itself as legitimate software or a file",
            "A firewall rule",
            "A network cable",
            "An operating system update"
        ],

        correct: 0
    },


    {
        question:
            "What is a DDoS attack designed to do?",

        answers: [
            "Improve network performance",
            "Overwhelm a service with large amounts of traffic",
            "Create stronger passwords",
            "Encrypt a user's files"
        ],

        correct: 1
    },


    {
        question:
            "What is authentication?",

        answers: [
            "Determining what a user is allowed to access",
            "Verifying who or what someone is",
            "Deleting an account",
            "Updating a firewall"
        ],

        correct: 1
    },


    {
        question:
            "Which is a good cybersecurity practice?",

        answers: [
            "Reuse the same password everywhere",
            "Ignore software updates",
            "Use MFA and keep software updated",
            "Share account credentials with friends"
        ],

        correct: 2
    }

];


/* =========================================
   QUIZ VARIABLES
========================================= */

let currentQuestion = 0;

let score = 0;

let selectedAnswer = null;


/* =========================================
   LOAD QUESTION
========================================= */

function loadQuestion() {

    const question =
        questions[currentQuestion];


    selectedAnswer = null;


    document.getElementById(
        "questionNumber"
    ).textContent =
        "Question " +
        (currentQuestion + 1);


    document.getElementById(
        "progressText"
    ).textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;


    document.getElementById(
        "progressFill"
    ).style.width =
        (
            ((currentQuestion + 1)
            / questions.length)
            * 100
        ) + "%";


    document.getElementById(
        "questionText"
    ).textContent =
        question.question;


    const answers =
        document.getElementById(
            "answers"
        );


    answers.innerHTML = "";


    question.answers.forEach(
        function(answer, index) {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer";


            button.textContent =
                answer;


            button.onclick =
                function() {

                    selectAnswer(
                        index,
                        button
                    );

                };


            answers.appendChild(
                button
            );

        }
    );


    const nextButton =
        document.getElementById(
            "nextButton"
        );


    if (
        currentQuestion ===
        questions.length - 1
    ) {

        nextButton.textContent =
            "Finish Quiz ✓";

    } else {

        nextButton.textContent =
            "Next Question →";

    }

}


/* =========================================
   SELECT ANSWER
========================================= */

function selectAnswer(
    index,
    button
) {

    selectedAnswer = index;


    const buttons =
        document.querySelectorAll(
            ".answer"
        );


    buttons.forEach(
        function(item) {

            item.classList.remove(
                "selected"
            );

        }
    );


    button.classList.add(
        "selected"
    );

}


/* =========================================
   NEXT QUESTION
========================================= */

function nextQuestion() {

    if (
        selectedAnswer === null
    ) {

        alert(
            "Please select an answer first."
        );

        return;

    }


    if (
        selectedAnswer ===
        questions[currentQuestion].correct
    ) {

        score++;

    }


    currentQuestion++;


    if (
        currentQuestion <
        questions.length
    ) {

        loadQuestion();

    } else {

        showResult();

    }

}


/* =========================================
   SHOW RESULT
========================================= */

function showResult() {

    document.getElementById(
        "quizCard"
    ).style.display =
        "none";


    document.querySelector(
        ".progress-box"
    ).style.display =
        "none";


    document.getElementById(
        "result"
    ).style.display =
        "block";


    document.getElementById(
        "score"
    ).textContent =
        score +
        " / " +
        questions.length;


    let message;


    const percentage =
        (
            score /
            questions.length
        ) * 100;


    if (percentage >= 90) {

        message =
            "🏆 Excellent work! You have a strong understanding of the cybersecurity fundamentals.";

    }

    else if (percentage >= 75) {

        message =
            "🟢 Great job! You have a solid cybersecurity foundation.";

    }

    else if (percentage >= 60) {

        message =
            "🟡 Good start! Review the Lessons and Labs to strengthen your knowledge.";

    }

    else {

        message =
            "🔵 Keep learning! Go through the Lessons and Labs and try the quiz again.";

    }


    document.getElementById(
        "resultMessage"
    ).textContent =
        message;

}


/* =========================================
   RESTART QUIZ
========================================= */

function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    selectedAnswer = null;


    document.getElementById(
        "quizCard"
    ).style.display =
        "block";


    document.querySelector(
        ".progress-box"
    ).style.display =
        "block";


    document.getElementById(
        "result"
    ).style.display =
        "none";


    loadQuestion();

}


/* =========================================
   START QUIZ
========================================= */

loadQuestion();

</script>


</body>

</html>
